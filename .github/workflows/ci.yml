name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries for the GUI
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Build and test (unit tests and the black-box suite in rust/tests)
        working-directory: rust
        run: |
          cargo build --release
          cargo build --release --features gui --bin drtable-gui
          cargo test --release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: drtable.exe
            gui: drtable-gui.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: drtable
            gui: drtable-gui
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: drtable
            gui: drtable-gui
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux libraries for the GUI
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Build
        working-directory: rust
        run: |
          cargo build --release --target ${{ matrix.target }}
          cargo build --release --features gui --bin drtable-gui --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          NAME="drtable-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$NAME"
          cp "rust/target/${{ matrix.target }}/release/${{ matrix.binary }}" "$NAME/"
          cp "rust/target/${{ matrix.target }}/release/${{ matrix.gui }}" "$NAME/"
          cp -r unreal README.md README.ko.md docs "$NAME/"
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "$NAME.zip" "$NAME"; else zip -qr "$NAME.zip" "$NAME"; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: drtable-*.zip
