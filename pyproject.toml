[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drtablesystem"
version = "0.1.0"
description = "DrTableSystem (Design-to-Runtime Table System): Excel tables to Unreal C++, baked DataAssets and server/client JSON"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1,<4"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.13,<1"]

[project.scripts]
drtable = "drtable.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/drtable"]
