# Test suite only: black-box tests of the drtable executable (rust/). Not a package.
[project]
name = "DrTableSystem-tests"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1,<4",
    "pytest>=8,<9",
    "ruff>=0.13,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
