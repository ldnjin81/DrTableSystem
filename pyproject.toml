[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tablegen"
version = "0.1.0"
description = "엑셀 기반 C++ 및 JSON 데이터 생성기"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1,<4"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.13,<1"]

[project.scripts]
tablegen = "tablegen.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/tablegen"]
